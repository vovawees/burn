# /etc/burn/burn.conf - plain shell assignments, read by burn itself (no bash). The file is read
# twice: before and after the profile, so your settings win over the profile.

#PROFILE=native                 # see: burn profile list | burn profile detect
#CHANNEL=main                   # recipe branch to follow: edge | main | security
#JOBS=4                         # parallel build jobs (default: all CPUs)
#FETCH_JOBS=4                   # parallel downloads (every source is fetched before building)
#FEATURES="-nls x11"            # global feature switches (per package: /etc/burn/package.features)
#LOCALES="en ru"                # translations to keep, "all" keeps everything, "" disables NLS
#KEEP_DOCS=0 KEEP_INFO=0 KEEP_MAN=1
#OPT_FLAGS="-O2 -pipe"          # optimisation level; CPU flags come from the profile
#LTO=1                          # link time optimisation for every recipe without options=(!lto)
#CCACHE=1 CCACHE_SIZE=5G        # reuse compiled objects between rebuilds (needs ccache)
#LINKER=mold                    # faster linking: mold | lld | bfd (recipes may opt out: !linker)
#COMPILER=gcc                   # gcc | clang: native builds with clang and the LLVM binutils
                                # (ThinLTO, lld by default; recipes may opt out: !clang)
#PGO=0                          # 1: profile guided optimization of the recipes with options=(pgo):
                                # an instrumented build, its training (do_pgo or the check), the real build
#STRIP_BINARIES=1
#CHECK=0                        # run test suites (slower, safer)
#ISOLATE=auto                   # build phases without network (own network namespace, only lo);
                                # as root they run as BUILD_USER. auto: what the kernel allows, 1: required, 0: off
#BUILD_USER=burn                # the unprivileged user of root's builds
#MESON_AUTO_FEATURES=disabled   # deterministic, minimal meson builds
#ALLOW_NONFREE=0                # 1: also build and install recipes of the category nonfree
                                # (proprietary licenses, e.g. the NVIDIA driver)
#SIGNING_KEY=/etc/burn/signing/desk.key  # sign every build of this machine (burn key new)
#BINARY_CACHES=(https://desk.lan:8080)   # the package caches of your other machines: a missing build
                                # is taken from there when a key of /etc/burn/keys signed it
#SNAPSHOTS=5                    # read-only btrfs snapshots of / kept from updates (0: none)
#RECIPE_REPOS=(https://github.com/vovawees/CleanLinux-Recipes.git)
#RECIPE_PATHS=(/usr/local/share/burn/recipes)   # local overlays, searched first
#CORE_PKGS=(glibc gcc binutils linux mesa llvm)  # marked as risky in update plans
#ASSUME_INSTALLED=()            # packages provided outside burn
