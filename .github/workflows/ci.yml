name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev zstd
      - name: build (warnings are errors)
        run: make CC=${{ matrix.cc }} WERROR=1
      - name: test
        run: make CC=${{ matrix.cc }} check

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev zstd
      - name: test with ASan + UBSan
        run: make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" check
