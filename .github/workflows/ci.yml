name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev zstd
      - name: build (warnings are errors)
        run: make CC=${{ matrix.cc }} WERROR=1
      - name: recipes
        run: git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git ../CleanLinux-Recipes
      - name: test (and every recipe against bash)
        run: make CC=${{ matrix.cc }} check RECIPES=../CleanLinux-Recipes/packages

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev zstd
      - name: recipes
        run: git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git ../CleanLinux-Recipes
      - name: test with ASan + UBSan
        run: >-
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined" check RECIPES=../CleanLinux-Recipes/packages

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (the test recipes use every build type)
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq libzstd-dev zstd
          autoconf cmake meson ninja-build patch unzip
      - name: prototype and recipes
        run: |
          git clone -q --depth 1 https://github.com/vovawees/CleanLinux.git ../CleanLinux
          git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git ../CleanLinux-Recipes
      - name: every ported command against the bash prototype
        run: make WERROR=1 proto
